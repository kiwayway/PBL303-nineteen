# Production-oriented single-host Compose. Put secrets in .env and terminate HTTPS at a trusted reverse proxy.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nineteen
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: nineteen_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nineteen -d nineteen_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build: .
    restart: unless-stopped
    command: sh -c "flask --app wsgi db upgrade && gunicorn --workers 3 --timeout 60 --access-logfile - --error-logfile - -b 0.0.0.0:5000 wsgi:app"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://nineteen:${DB_PASSWORD}@db:5432/nineteen_db
      COOKIE_SECURE: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/app/static/uploads
      - private_uploads:/app/instance/private_uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  uploads:
  private_uploads:
