{% extends "admin/base.html" %}
{% block content %}
<div class="mb-5"><h1 class="text-2xl font-bold">Kategori</h1><p class="mt-1 text-sm text-slate-500">Tambah dan hapus kategori marketplace. Kategori yang masih digunakan jasa tidak bisa dihapus.</p></div>
<form method="post" class="mb-4 flex flex-wrap gap-2 rounded-2xl border bg-white p-4"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input name="name" maxlength="80" required placeholder="Nama kategori baru" class="min-w-0 flex-1 rounded-lg border px-3 py-2 text-sm"><button class="rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white">Tambah kategori</button></form>
<div class="overflow-hidden rounded-2xl border bg-white shadow-sm"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="p-4">Nama kategori</th><th class="p-4">Jumlah jasa</th><th class="p-4">Aksi</th></tr></thead><tbody>{% for c in rows %}<tr class="border-t border-slate-100"><td class="p-4 font-semibold">{{ c.name }}</td><td class="p-4">{{ c.services|length }}</td><td class="p-4"><form method="post" action="{{ url_for('admin.delete_category', category_id=c.id) }}" onsubmit="return confirm('Hapus kategori ini?')"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50">Hapus</button></form></td></tr>{% else %}<tr><td colspan="3" class="p-8 text-center text-slate-500">Belum ada kategori.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
