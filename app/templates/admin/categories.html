{% extends "admin/base.html" %}
{% block content %}
<div class="mb-5"><h1 class="text-2xl font-bold">Kategori</h1><p class="mt-1 text-sm text-slate-500">Kelola nama, logo, dan background kategori. Kategori yang masih digunakan jasa tidak bisa dihapus.</p></div>
<form method="post" enctype="multipart/form-data" class="mb-5 grid gap-3 rounded-2xl border bg-white p-4 md:grid-cols-2">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input name="name" maxlength="80" required placeholder="Nama kategori baru" class="min-w-0 rounded-lg border px-3 py-2 text-sm md:col-span-2">
  <label class="text-sm font-semibold">Logo kategori (opsional)<input type="file" name="logo_image" accept="image/jpeg,image/png,image/webp" class="mt-2 block w-full rounded-lg border p-2 text-sm font-normal"><span class="mt-1 block text-xs font-normal text-slate-500">JPG, PNG, WebP · maks. 2 MB · disarankan persegi</span></label>
  <label class="text-sm font-semibold">Background kategori (opsional)<input type="file" name="background_image" accept="image/jpeg,image/png,image/webp" class="mt-2 block w-full rounded-lg border p-2 text-sm font-normal"><span class="mt-1 block text-xs font-normal text-slate-500">JPG, PNG, WebP · maks. 5 MB · disarankan 16:9</span></label>
  <button class="rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white md:col-span-2">Tambah kategori</button>
</form>
<div class="space-y-4">{% for c in rows %}
  <section class="rounded-2xl border bg-white p-4 shadow-sm">
    <div class="mb-3 flex flex-wrap items-center justify-between gap-2"><div class="font-semibold">{{ c.name }}</div><div class="text-sm text-slate-500">{{ c.services|length }} jasa</div></div>
    <form method="post" enctype="multipart/form-data" action="{{ url_for('admin.update_category_images', category_id=c.id) }}" class="grid gap-3 md:grid-cols-2">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="text-sm font-medium">Logo saat ini{% if c.logo_image %}<img src="{{ c.logo_image|media_url }}" alt="Logo {{ c.name }}" class="my-2 h-16 w-16 rounded-lg border object-contain">{% else %}<span class="my-2 flex h-16 w-16 items-center justify-center rounded-lg bg-slate-100 text-2xl text-slate-400">{{ c.name[:1]|upper }}</span>{% endif %}<input type="file" name="logo_image" accept="image/jpeg,image/png,image/webp" class="block w-full rounded-lg border p-2 text-xs"><span class="mt-1 block text-xs text-slate-500">Maks. 2 MB</span>{% if c.logo_image %}<span class="mt-2 block text-xs"><input type="checkbox" name="remove_logo_image" value="1"> Hapus logo</span>{% endif %}</label>
      <label class="text-sm font-medium">Background saat ini{% if c.background_image %}<img src="{{ c.background_image|media_url }}" alt="Background {{ c.name }}" class="my-2 h-16 w-full rounded-lg border object-cover">{% else %}<span class="my-2 flex h-16 w-full items-center justify-center rounded-lg bg-gradient-to-r from-sky-300 to-emerald-800 text-xs text-white">Belum ada background</span>{% endif %}<input type="file" name="background_image" accept="image/jpeg,image/png,image/webp" class="block w-full rounded-lg border p-2 text-xs"><span class="mt-1 block text-xs text-slate-500">Maks. 5 MB</span>{% if c.background_image %}<span class="mt-2 block text-xs"><input type="checkbox" name="remove_background_image" value="1"> Hapus background</span>{% endif %}</label>
      <button class="rounded-lg border border-brand px-4 py-2 text-sm font-semibold text-brand md:col-span-2">Simpan gambar</button>
    </form>
    <form method="post" action="{{ url_for('admin.delete_category', category_id=c.id) }}" class="mt-3 border-t pt-3" onsubmit="return confirm('Hapus kategori ini?')"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50">Hapus kategori</button></form>
  </section>
{% else %}<p class="rounded-xl border bg-white p-8 text-center text-slate-500">Belum ada kategori.</p>{% endfor %}</div>
{% endblock %}
