{% extends "admin/base.html" %}{% block content %}
<h1 class="text-2xl font-bold">{{ 'Edit jasa' if service else 'Tambah jasa' }}</h1>
<form method="post" enctype="multipart/form-data" class="mt-5 max-w-3xl space-y-4 rounded-2xl border bg-white p-6">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label class="block text-sm font-semibold">Judul jasa<input required name="title" maxlength="160" value="{{ service.title if service else '' }}" class="mt-1 w-full rounded-xl border p-3"></label>
<label class="block text-sm font-semibold">Seller<select required name="seller_id" class="mt-1 w-full rounded-xl border p-3">{% for seller in sellers %}<option value="{{ seller.id }}" {{ 'selected' if service and service.seller_id==seller.id }}>{{ seller.name }} · {{ seller.email }}</option>{% endfor %}</select></label>
<label class="block text-sm font-semibold">Kategori<select required name="category_id" class="mt-1 w-full rounded-xl border p-3">{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if service and service.category_id==c.id }}>{{ c.name }}</option>{% endfor %}</select></label>
<label class="block text-sm font-semibold">Deskripsi<textarea required name="description" rows="6" class="mt-1 w-full rounded-xl border p-3">{{ service.description if service else '' }}</textarea></label>
<label class="block text-sm font-semibold">Gambar PNG/JPEG/WebP, maks. 4MB<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp" class="mt-1 block"></label>
<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_active" value="1" {{ 'checked' if not service or service.is_active }}> Publikasikan jasa</label>
{% if not service %}<hr><h2 class="font-bold">Paket pertama</h2><input required name="package_name" placeholder="Nama paket" class="w-full rounded-xl border p-3"><input required type="number" min="1" name="price" placeholder="Harga (IDR)" class="w-full rounded-xl border p-3"><input required type="number" min="1" max="365" name="duration_days" value="1" class="w-full rounded-xl border p-3">{% endif %}
<button class="rounded-xl bg-brand px-5 py-3 font-semibold text-white">Simpan</button></form>
{% if service %}<section class="mt-8 max-w-3xl rounded-2xl border bg-white p-6"><h2 class="font-bold">Paket jasa</h2>
{% for p in service.packages %}<form method="post" action="{{ url_for('admin.package_edit',package_id=p.id) }}" class="grid gap-2 border-b py-3 sm:grid-cols-4"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input name="name" value="{{ p.name }}" required class="rounded border p-2"><input name="price" type="number" min="1" value="{{ p.price }}" required class="rounded border p-2"><input name="duration_days" type="number" min="1" max="365" value="{{ p.duration_days }}" required class="rounded border p-2"><button class="rounded border px-2 py-2 text-sm">Simpan paket</button><p class="text-xs text-slate-500 sm:col-span-4">{{ 'Aktif' if p.is_active else 'Nonaktif' }} · <button formmethod="post" formaction="{{ url_for('admin.package_toggle',package_id=p.id) }}" class="text-brand">Ubah status</button></p></form>{% endfor %}
<form method="post" action="{{ url_for('admin.package_create',service_id=service.id) }}" class="mt-4 grid gap-3 sm:grid-cols-2"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input required name="name" placeholder="Nama paket" class="rounded-xl border p-3"><input required name="price" type="number" min="1" placeholder="Harga" class="rounded-xl border p-3"><input required name="duration_days" type="number" min="1" max="365" value="1" class="rounded-xl border p-3"><input name="description" placeholder="Deskripsi paket" class="rounded-xl border p-3"><button class="rounded-xl bg-brand p-3 font-semibold text-white sm:col-span-2">Tambah paket</button></form></section>{% endif %}{% endblock %}
