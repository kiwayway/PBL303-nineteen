<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - nineteen</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{brand:{DEFAULT:'#2F7BF5',dark:'#1F5FD0',soft:'#EAF3FF'},sun:'#FFC933',ink:'#1B2A4A'}}}}
</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-ink flex items-center justify-center p-4">
<main class="w-full max-w-5xl bg-white rounded-2xl shadow-xl shadow-blue-900/5 overflow-hidden relative">
  <header class="absolute inset-x-0 top-0 z-10 flex items-center justify-between px-6 py-4 text-xs">
    <a href="login.html" class="flex items-center gap-2 font-extrabold text-ink text-base">
      <img src="{{ url_for('static', filename='assets/Mask group.png') }}" width="90" alt=""></a>
  </header>
  <div class="grid md:grid-cols-2 min-h-[600px]">
    <!-- Panel kiri -->
    <section class="relative overflow-hidden bg-gradient-to-br from-brand-soft to-white px-8 pt-24 pb-8 md:px-10 flex flex-col">
      
      <div class="absolute right-0 top-16 w-24 h-24 bg-sun rounded-full opacity-80"></div>
      
      <div class="relative z-10">
        <h1 class="text-3xl md:text-4xl font-extrabold leading-tight text-brand-dark">Belanja lebih mudah, tanpa batas.</h1>
        <p class="mt-3 text-sm text-slate-600 max-w-xs">Fasco hadir untuk membawa produk favoritmu dengan aman dan cepat.</p>
      </div>
      <!-- Maskot: ganti dengan <img src="maskot.png"> jika sudah punya aset -->
      <div class="relative z-10 mt-auto mx-auto pt-6">
        <img src="{{ url_for('static', filename='assets/login.png') }}" alt="" class="z-20">
      </div>
    </section>
    <!-- Panel kanan -->
    <section class="px-8 md:px-12 py-24 flex flex-col justify-center">
      <div class="w-full max-w-sm mx-auto">
<h2 class="text-xl font-bold">Selamat datang kembali</h2><p class="text-sm text-slate-500 mb-6">Masuk untuk melanjutkan belanja.</p>
<form onsubmit="event.preventDefault();alert('Login berhasil (demo)')">
<div class="mb-4"><label for="identifier" class="block text-xs font-semibold mb-1.5">Email atau nomor HP</label><div class="relative"><input id="identifier" name="identifier" type="text" placeholder="Masukkan email atau nomor HP" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand" ></div></div>
<div class="mb-4"><label for="password" class="block text-xs font-semibold mb-1.5">Password</label><div class="relative"><input id="password" name="password" type="password" placeholder="Masukkan password" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand pr-10" ><button type="button" data-eye="password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="Tampilkan password"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div class="flex items-center justify-between text-xs mb-5"><label class="flex items-center gap-2 text-slate-600"><input type="checkbox" class="rounded border-slate-300 text-brand focus:ring-brand">Ingat saya</label><a href="forgot-password.html" class="font-semibold text-brand hover:underline">Lupa password?</a></div>
<button type="submit" class="w-full rounded-lg bg-brand hover:bg-brand-dark text-white text-sm font-semibold py-2.5 transition focus:outline-none focus:ring-2 focus:ring-brand/40 focus:ring-offset-2">Masuk</button></form>
<div class="flex items-center gap-3 my-4 text-xs text-slate-400"><span class="h-px flex-1 bg-slate-200"></span>atau<span class="h-px flex-1 bg-slate-200"></span></div><button type="button" class="w-full flex items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-sm font-medium py-2.5 transition"><svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4.1 6.8-10.1 6.8-17.2z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.700-4-13.600-9.800l-7.800 6.100C6.500 42.600 14.600 48 24 48z"/></svg>Masuk dengan Google</button>
<p class="text-xs text-center text-slate-500 mt-5">Belum punya akun? <a href="/register" class="font-semibold text-brand hover:underline">Daftar sekarang</a></p>      </div>
    </section>
  </div>
</main>
<script>
document.querySelectorAll('[data-eye]').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById(b.dataset.eye);i.type=i.type==='password'?'text':'password';}));
</script>
</body>
</html>
