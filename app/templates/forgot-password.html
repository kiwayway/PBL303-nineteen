<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa password - Fasco</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{brand:{DEFAULT:'#2F7BF5',dark:'#1F5FD0',soft:'#EAF3FF'},sun:'#FFC933',ink:'#1B2A4A'}}}}
</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-ink flex items-center justify-center p-4">
<main class="w-full max-w-5xl bg-white rounded-2xl shadow-xl shadow-blue-900/5 overflow-hidden relative">
  <header class="absolute inset-x-0 top-0 z-10 flex items-center justify-between px-6 py-4 text-xs">
    <a href="login.html" class="flex items-center gap-2 font-extrabold text-ink text-base">
      <img src="{{ url_for('static', filename='assets/Mask group.png') }}" width="90" alt=""></a>
    <span></span>
  </header>
  <div class="grid md:grid-cols-2 min-h-[600px]">
    <!-- Panel kiri -->
    <section class="relative overflow-hidden  px-8 pt-24 pb-8 md:px-10 flex flex-col">
      <div class="absolute right-0 top-16 w-24 h-24 bg-sun rounded-full opacity-80"></div>
      <div class="relative z-10">
        <h1 class="text-3xl md:text-4xl font-extrabold leading-tight text-brand-dark">Lupa password?</h1>
        <p class="mt-3 text-sm text-slate-600 max-w-xs">Tenang, kami siap membantu. Masukkan email yang terdaftar di akun Fasco, dan kami akan mengirimkan instruksi untuk mengatur ulang password.</p>
      </div>
      <!-- Maskot: ganti dengan <img src="maskot.png"> jika sudah punya aset -->
      <div class="relative z-10 mt-auto mx-auto pt-6">
        <img src="{{ url_for('static', filename='assets/forgot.png') }}" alt="">
      </div>
    </section>
    <!-- Panel kanan -->
    <section class="px-8 md:px-12 py-24 flex flex-col justify-center">
      <div class="w-full max-w-sm mx-auto">
<h2 class="text-xl font-bold">Atur ulang password</h2><p class="text-sm text-slate-500 mb-6">Masukkan email yang terdaftar pada akunmu.</p>
<form onsubmit="event.preventDefault();location.href='verify.html'">
<div class="mb-4"><label for="email" class="block text-xs font-semibold mb-1.5">Email</label><div class="relative"><input id="email" name="email" type="email" placeholder="Masukkan email kamu" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand" ></div></div>
<button type="submit" class="w-full rounded-lg bg-brand hover:bg-brand-dark text-white text-sm font-semibold py-2.5 transition focus:outline-none focus:ring-2 focus:ring-brand/40 focus:ring-offset-2">Kirim instruksi</button></form>
<p class="text-xs text-center mt-6"><a href="login.html" class="font-semibold text-brand hover:underline">Kembali ke halaman masuk</a></p>      </div>
    </section>
  </div>
</main>

</body>
</html>
