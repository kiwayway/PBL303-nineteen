{% extends "base.html" %}{% block body %}{% include "components/navbar.html" %}<main class="mx-auto max-w-3xl px-5 py-10"><h1 class="text-3xl font-bold">Checkout</h1><form method="post" class="mt-6 rounded-2xl border p-6"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><h2 class="font-bold">Pesanan</h2>{% for i in items %}<div class="flex justify-between border-b py-3 text-sm"><span>{{ i.package.service.title }} — {{ i.package.name }}</span><b>{{ i.package.price|rupiah }}</b></div>{% endfor %}<div class="flex justify-between py-4 text-lg font-bold"><span>Total</span><span>{{ total|rupiah }}</span></div><label class="mb-2 block text-sm font-semibold">Catatan kebutuhan (opsional)</label><textarea name="note" maxlength="255" rows="3" class="mb-4 w-full rounded-xl border p-3"></textarea><button class="mt-5 w-full rounded-xl bg-brand p-3 font-semibold text-white">Buat pesanan</button></form></main>{% include "components/footer.html" %}{% endblock %}
