<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>{% block title %}nineteen studios{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] },
        colors: { brand: '#2f80ed', accent: '#ff9a1f', hero: '#8a9fdc' }
      }
    }
  }
</script>
<style>
  :focus-visible { outline: 2px solid #2f80ed; outline-offset: 3px; }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/site-loader.css') }}">
<script src="{{ url_for('static', filename='js/site-loader.js') }}" defer></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-white pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] font-sans text-black">
{% include "components/loading_screen.html" %}
{% block body %}{% endblock %}
</body>
</html>
