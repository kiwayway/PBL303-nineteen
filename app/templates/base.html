<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Nineteen Studios{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{brand:{DEFAULT:'#2F7BF5',dark:'#1F5FD0',soft:'#EAF3FF'},ink:'#1B2A4A',sun:'#F5A524'}}}}</script>
<style>
  .hero-bg{background:linear-gradient(180deg,#8fa4e0 0%,#a9b9ea 55%,#ffffff 100%)}
  :focus-visible{outline:2px solid #1F5FD0;outline-offset:2px}
</style>
</head>
<body class="min-h-screen bg-white font-sans text-ink">
{% block body %}{% endblock %}
</body>
</html>
