<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fasco{% endblock %} - Fasco</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{brand:{DEFAULT:'#2F7BF5',dark:'#1F5FD0',soft:'#EAF3FF'},ink:'#1B2A4A'}}}}</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-ink">
<header class="flex items-center justify-between px-6 py-4 bg-white shadow-sm">
  <a href="{{ url_for('main.index') }}"><img src="{{ url_for('static', filename='img/logo.png') }}" width="90" alt="Fasco"></a>
  {% if user %}
  <form method="post" action="{{ url_for('auth.logout') }}" class="flex items-center gap-3 text-sm">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <span>Halo, <b>{{ user.name }}</b></span>
    <button class="rounded-lg border border-slate-200 px-3 py-1.5 font-semibold hover:bg-slate-50">Keluar</button>
  </form>
  {% else %}
  <nav class="flex gap-3 text-sm font-semibold">
    <a href="{{ url_for('auth.login') }}" class="px-3 py-1.5 text-brand">Masuk</a>
    <a href="{{ url_for('auth.register') }}" class="rounded-lg bg-brand text-white px-3 py-1.5 hover:bg-brand-dark">Daftar</a>
  </nav>
  {% endif %}
</header>
<main class="max-w-6xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>
</body>
</html>
